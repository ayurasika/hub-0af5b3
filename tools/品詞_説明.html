<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>品詞 説明スライド｜こころの国語</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#b8e4ff; --bg2:#f5faff; --bg3:#fff5fa;
  --sky:#4a9eff; --mint:#66bb6a; --sakura:#ff8aa8; --gold:#ffb74d;
  --ink:#1a2a4a; --sub:#5a6a8a; --line:rgba(70,120,200,.18);
  --card:rgba(255,255,255,.92); --cardb:rgba(255,255,255,.98);
  --red:#ff6b6b; --blue:#3c8cdb; --green:#4abf4a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;font-family:'Noto Sans JP',sans-serif;color:var(--ink);}
body{
  background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%);
  background-attachment:fixed; min-height:100vh; overflow-x:hidden;
}
.cloud{position:fixed;color:rgba(255,255,255,.7);font-size:60px;pointer-events:none;animation:drift linear infinite;z-index:0;}
@keyframes drift{from{transform:translateX(-150px)}to{transform:translateX(110vw)}}
.petal{position:fixed;color:var(--sakura);opacity:.45;pointer-events:none;animation:fall linear infinite;z-index:0;font-size:16px;}
@keyframes fall{from{transform:translateY(-20px) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}

/* ヘッダー */
header{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line); padding:10px 14px;}
.htop{display:flex;align-items:center;gap:10px;}
.htitle{font-weight:900;font-size:16px;flex:1;line-height:1.3;}
.htitle span{color:var(--sky);}
.menubtn{background:none;border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:18px;cursor:pointer;color:var(--sky);font-family:inherit;}
.progress-wrap{margin-top:6px;}
.progress-label{font-size:11px;color:var(--sub);display:flex;justify-content:space-between;margin-bottom:3px;}
.progress-bar{height:8px;background:rgba(74,158,255,.12);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--sky),var(--mint),var(--sakura));width:0%;transition:width .5s;}

/* メイン */
main{max-width:760px;margin:0 auto;padding:14px;position:relative;z-index:1;min-height:calc(100vh - 180px);}

.slide{display:none;animation:fadein .5s ease;}
.slide.active{display:block;}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.card{background:var(--cardb);border:1px solid var(--line);border-radius:20px;padding:20px 18px;box-shadow:0 6px 24px rgba(74,158,255,.10);}
.card h2{margin:0 0 10px;color:var(--sky);font-size:22px;line-height:1.35;}
.card h2 .num{display:inline-block;background:linear-gradient(135deg,var(--sky),var(--mint));color:#fff;font-size:13px;padding:3px 10px;border-radius:99px;vertical-align:middle;margin-right:8px;font-weight:700;}
.card h3{color:var(--mint);font-size:16px;margin:14px 0 6px;border-left:5px solid var(--mint);padding-left:9px;}
.card p{line-height:1.85;font-size:14.5px;margin:8px 0;}
.card ul{line-height:1.85;font-size:14px;padding-left:22px;margin:6px 0;}
.card li{margin-bottom:4px;}
.kotae{color:var(--sky);font-weight:700;}

.def{background:linear-gradient(135deg,#eef7ff,#fdf6ff);border:2px solid var(--sky);border-radius:14px;padding:12px 14px;margin:10px 0;font-size:14.5px;line-height:1.75;}
.def b{color:var(--sky);}
.ex{background:#f0fff4;border-left:5px solid var(--mint);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:14px;line-height:1.85;}
.ex b{color:var(--mint);}
.warn{background:#fff5f5;border-left:5px solid var(--red);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13.5px;line-height:1.7;}
.warn b{color:var(--red);}
.tip{background:#fffaef;border-left:5px solid var(--gold);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13.5px;line-height:1.7;}
.tip b{color:#e67e00;}

.quiz{background:linear-gradient(135deg,#fff8fb,#fff0f7);border:2px dashed var(--sakura);border-radius:14px;padding:14px;margin:14px 0;}
.quiz h4{margin:0 0 8px;color:var(--sakura);font-size:15px;}
.quiz .q{font-size:15px;line-height:1.8;margin:6px 0 10px;}
.quiz input[type=text]{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;font-size:15px;font-family:inherit;background:#fff;}
.quiz .opts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;}
.quiz .opts button{flex:1 1 calc(50% - 6px);padding:9px 8px;background:#fff;border:1.5px solid var(--line);border-radius:10px;font-size:13.5px;cursor:pointer;font-family:inherit;color:var(--ink);font-weight:500;}
.quiz .opts button.sel{background:linear-gradient(135deg,var(--sky),var(--mint));color:#fff;border-color:transparent;}
.quiz .check{margin-top:8px;width:100%;padding:10px;background:linear-gradient(135deg,var(--sakura),var(--gold));color:#fff;border:none;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.quiz .ans{display:none;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.7;}
.quiz .ans.show{display:block;animation:fadein .3s ease;}
.quiz .ans b{color:var(--sky);}
.quiz .ans.ng b{color:var(--red);}

/* 表 */
.tbl{width:100%;border-collapse:collapse;margin:10px 0;font-size:13px;background:#fff;border-radius:10px;overflow:hidden;}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 8px;text-align:left;line-height:1.6;vertical-align:top;}
.tbl th{background:linear-gradient(135deg,#eef7ff,#f5faff);color:var(--sky);font-weight:700;}
.tbl tr:nth-child(even) td{background:#fafdff;}

/* 樹形図 */
.tree{font-size:13px;line-height:1.9;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:'Noto Sans JP',monospace;white-space:pre;overflow-x:auto;color:var(--ink);}

/* 比較 */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0;}
.compare>div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13.5px;line-height:1.7;}
.compare>div b{color:var(--sky);display:block;margin-bottom:4px;}

/* ナビ */
.nav{display:flex;gap:8px;margin-top:18px;}
.nav button{flex:1;padding:12px;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;}
.nav .prev{background:#fff;border:1.5px solid var(--line);color:var(--sub);}
.nav .next{background:linear-gradient(135deg,var(--sky),var(--mint));color:#fff;box-shadow:0 4px 12px rgba(74,158,255,.25);}
.nav button:disabled{opacity:.4;cursor:not-allowed;}

.pageno{text-align:center;font-size:11.5px;color:var(--sub);margin-top:10px;}

/* 目次ドロワー */
.drawer{position:fixed;top:0;right:-340px;width:320px;max-width:90vw;height:100%;background:#fff;z-index:100;box-shadow:-4px 0 20px rgba(0,0,0,.15);transition:right .3s;overflow-y:auto;}
.drawer.open{right:0;}
.drawer-head{padding:14px;border-bottom:1px solid var(--line);display:flex;align-items:center;}
.drawer-head b{flex:1;color:var(--sky);font-size:16px;}
.drawer-head button{background:none;border:none;font-size:24px;color:var(--sub);cursor:pointer;}
.drawer ol{list-style:none;padding:0;margin:0;}
.drawer ol li{border-bottom:1px solid var(--line);padding:11px 14px;font-size:13.5px;cursor:pointer;line-height:1.5;display:flex;gap:8px;}
.drawer ol li:hover{background:#f0f8ff;}
.drawer ol li .nn{color:var(--sky);font-weight:700;flex:0 0 28px;}
.drawer ol li.cur{background:linear-gradient(135deg,#eef7ff,#fff0f7);font-weight:700;}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99;display:none;}
.overlay.show{display:block;}

/* 完了モーダル */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.show{display:flex;}
.modal-card{background:#fff;border-radius:20px;padding:24px;max-width:340px;text-align:center;}
.modal-card h3{color:var(--sakura);margin:0 0 10px;font-size:20px;}
.modal-card p{font-size:14px;line-height:1.7;color:var(--sub);}
.modal-card button{margin-top:12px;padding:10px 24px;background:linear-gradient(135deg,var(--sakura),var(--gold));color:#fff;border:none;border-radius:99px;font-weight:700;cursor:pointer;font-family:inherit;font-size:14px;}

@media(max-width:420px){
  .card{padding:16px 14px;}
  .card h2{font-size:19px;}
  .compare{grid-template-columns:1fr;}
  .quiz .opts button{flex:1 1 100%;}
}
</style>
</head>
<body>

<!-- 雲・花びら -->
<div class="cloud" style="top:8%;animation-duration:60s;">☁︎</div>
<div class="cloud" style="top:30%;animation-duration:75s;animation-delay:-20s;font-size:40px;">☁︎</div>
<div class="cloud" style="top:55%;animation-duration:90s;animation-delay:-40s;font-size:50px;">☁︎</div>
<div class="petal" style="left:8%;animation-duration:18s;">❀</div>
<div class="petal" style="left:35%;animation-duration:22s;animation-delay:-6s;">✿</div>
<div class="petal" style="left:62%;animation-duration:25s;animation-delay:-12s;">❀</div>
<div class="petal" style="left:85%;animation-duration:20s;animation-delay:-3s;">✿</div>

<header>
  <div class="htop">
    <div class="htitle">品詞 説明スライド <span>こころの国語</span></div>
    <button class="menubtn" onclick="toggleDrawer()" aria-label="目次">≡</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-label"><span id="plabel">1 / 1</span><span id="ptitle"></span></div>
    <div class="progress-bar"><div class="progress-fill" id="pfill"></div></div>
  </div>
</header>

<main id="main"></main>

<div class="overlay" id="overlay" onclick="toggleDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-head"><b>目次</b><button onclick="toggleDrawer()">×</button></div>
  <ol id="toc"></ol>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <h3>全部読みきった！🌸</h3>
    <p>ね、ここまでよくがんばったね。<br>品詞の地図はもう頭に入ったよ。<br>あとは「覚えるツール」と「反射ドリル」で、手を動かして馴染ませよう。</p>
    <button onclick="closeModal()">閉じる</button>
  </div>
</div>

<script>
// ====== スライド定義 ======
const slides = [
  // 1. はじめに
  { t:"はじめに", html:`
    <h2><span class="num">1</span>品詞って、何のためにあるの？</h2>
    <p>ね、こころ。「品詞」って聞くと、なんか難しそうな顔したくなるよね。でも、品詞って実は<b>言葉を仲間分けしただけ</b>のものなの。</p>
    <div class="def"><b>品詞とは</b>：日本語の単語を、はたらき（仕事）の似ているものどうしでグループにしたもの。全部で<b>10種類</b>あるよ。</div>
    <p>なぜ覚えるの？って思うかもしれない。理由はシンプル。</p>
    <ul>
      <li>テストで「次の文の動詞を全部書きぬきなさい」って聞かれるから</li>
      <li>「ない」が動詞の一部か、それとも別の単語かを<b>見分ける問題</b>が出るから</li>
      <li>文の組み立てが分かると、長文を読むスピードが上がるから</li>
    </ul>
    <div class="tip"><b>大事なこと：</b>品詞は「暗記」じゃなくて「見分け方を身につけるもの」。これからのスライドで、その見分け方をひとつずつ教えていくね。</div>
  `},

  // 2. 大枠の地図
  { t:"10品詞の地図", html:`
    <h2><span class="num">2</span>まずは地図を見よう（10品詞）</h2>
    <p>こころ、いきなり全部覚えなくていい。最初に<b>「全体の地図」</b>だけ見ておくよ。これがあると、迷子にならない。</p>
    <table class="tbl">
      <tr><th>仲間</th><th>品詞</th><th>ざっくりの仕事</th></tr>
      <tr><td rowspan="3"><b>用言</b><br>（動きや様子）</td><td>動詞</td><td>動き・存在（〜る で終わる）</td></tr>
      <tr><td>形容詞</td><td>様子（〜い で終わる）</td></tr>
      <tr><td>形容動詞</td><td>様子（〜だ で終わる）</td></tr>
      <tr><td><b>体言</b></td><td>名詞</td><td>もの・人・ことの名前</td></tr>
      <tr><td rowspan="4">活用しない<br>自立語</td><td>副詞</td><td>主に用言をくわしくする</td></tr>
      <tr><td>連体詞</td><td>体言（名詞）をくわしくする</td></tr>
      <tr><td>接続詞</td><td>文や語をつなぐ</td></tr>
      <tr><td>感動詞</td><td>感動・呼びかけ・あいさつ</td></tr>
      <tr><td rowspan="2"><b>付属語</b></td><td>助動詞</td><td>意味をそえる（活用する）</td></tr>
      <tr><td>助詞</td><td>関係を示す（活用しない）</td></tr>
    </table>
    <div class="tip"><b>合言葉：</b>「<b>用言3つ・体言1つ・かざり&つなぎ4つ・付属2つ</b>」で10品詞。次のスライドで、自立語と付属語って何？を説明するよ。</div>
  `},

  // 3. 自立語と付属語
  { t:"自立語と付属語", html:`
    <h2><span class="num">3</span>自立語と付属語って？</h2>
    <p>10品詞は、まず大きく<b>2つ</b>に分かれるよ。</p>
    <div class="def"><b>自立語</b>：それ1語だけで意味が分かる単語。文の最初に来られる。<br>例：「<b>走る</b>」「<b>花</b>」「<b>きれいだ</b>」</div>
    <div class="def"><b>付属語</b>：自立語にくっついて使う単語。1語だけでは意味が分からない。<br>例：「<b>を</b>」「<b>が</b>」「<b>ない</b>」「<b>そうだ</b>」</div>
    <p>もうひとつ、大事な分け方が「<b>活用する／しない</b>」。活用とは、形が変わること。</p>
    <div class="ex">「書く」→「書か（ない）」「書き（ます）」「書け（ば）」と形が変わる。これが<b>活用</b>。</div>
    <h3>地図にすると</h3>
    <div class="tree">単語
├ 自立語
│  ├ 活用する
│  │  ├ 言い切りが「ウ段」 → <b>動詞</b>（走る・見る）
│  │  ├ 言い切りが「〜い」 → <b>形容詞</b>（青い・楽しい）
│  │  └ 言い切りが「〜だ」 → <b>形容動詞</b>（静かだ・元気だ）
│  └ 活用しない
│     ├ 主語になれる    → <b>名詞</b>（本・夢）
│     ├ 用言をくわしくする → <b>副詞</b>（とても・ゆっくり）
│     ├ 体言をくわしくする → <b>連体詞</b>（あの・大きな）
│     ├ つなぐ        → <b>接続詞</b>（しかし・そして）
│     └ 感動・呼びかけ   → <b>感動詞</b>（ああ・はい）
└ 付属語
   ├ 活用する  → <b>助動詞</b>（ない・た・そうだ）
   └ 活用しない → <b>助詞</b>（が・を・に・は）</div>
    <div class="tip"><b>言い切りって？</b>：その単語の「最後の形（〜だ／〜い／〜るで終わる、ふつうの形）」のこと。辞書に載っている形だよ。</div>
  `},

  // 4. 動詞 定義
  { t:"動詞 ①定義", html:`
    <h2><span class="num">4</span>動詞ってどんなもの？</h2>
    <div class="def"><b>動詞</b>：動きや存在を表す自立語。<b>言い切りの形がウ段の音（〜る、〜く、〜む など）</b>で終わる。活用するよ。</div>
    <h3>例</h3>
    <div class="ex">走<b>る</b>／読<b>む</b>／泣<b>く</b>／見<b>る</b>／起き<b>る</b>／書<b>く</b>／飲<b>む</b>／泳<b>ぐ</b>／話<b>す</b>／立<b>つ</b>／進行（す<b>る</b>）／ある／いる／来る</div>
    <p>「動詞」って名前のとおり、<b>動き</b>を表すのが基本。でも「ある」「いる」みたいに<b>存在</b>（〜があるよ／〜がいるよ）を表すのも動詞だよ。</p>
    <div class="tip"><b>ウ段って？</b>：あいうえおの「う」の段。<b>る・く・ぐ・す・つ・ぬ・ぶ・む・う</b>のどれか。日本語の動詞は必ずこの音で言い切る。</div>
  `},

  // 5. 動詞 見分け方
  { t:"動詞 ②見分け方", html:`
    <h2><span class="num">5</span>動詞の見分け方</h2>
    <p>こころ、文の中から動詞を見つけるときの<b>2ステップ</b>を教えるね。</p>
    <ol>
      <li>その単語を<b>言い切りの形</b>（最後の形）に直す</li>
      <li>「<b>〜ウ段</b>」で終わるなら動詞</li>
    </ol>
    <div class="ex">「公園で<b>遊んだ</b>」<br>→ 言い切りは「<b>遊ぶ</b>」<br>→「ぶ」はウ段 → ✓ <span class="kotae">動詞</span></div>
    <div class="ex">「ご飯を<b>食べて</b>いる」<br>→ 言い切りは「<b>食べる</b>」<br>→「る」はウ段 → ✓ <span class="kotae">動詞</span></div>
    <div class="warn"><b>気をつけて：</b>「<b>大きい</b>」「<b>静かだ</b>」は動きを表すように見えても、言い切りが「い」「だ」だから動詞じゃない。形容詞・形容動詞だよ。</div>
  `},

  // 6. 動詞 ためしてみよう
  { t:"動詞 ③ためしてみよう", html:`
    <h2><span class="num">6</span>ためしてみよう（動詞）</h2>
    <div class="quiz">
      <h4>Q. 次の文の中の動詞を、すべて選んでね。</h4>
      <div class="q">『 こころは 公園で 走り、 大きな 木を 見た。 』</div>
      <div class="opts" data-multi="1">
        <button data-a="0">こころ</button>
        <button data-a="0">公園</button>
        <button data-a="1">走り</button>
        <button data-a="0">大きな</button>
        <button data-a="0">木</button>
        <button data-a="1">見た</button>
      </div>
      <button class="check" onclick="checkQuiz(this)">こたえあわせ</button>
      <div class="ans">
        <b>正解：「走り」「見た」</b><br>
        「走り」は言い切ると「<b>走る</b>」、「見た」は言い切ると「<b>見る</b>」。どちらもウ段で終わる動詞だよ。「大きな」は連体詞、「こころ・公園・木」は名詞。
      </div>
    </div>
  `},

  // 7. 形容詞 定義
  { t:"形容詞 ①定義", html:`
    <h2><span class="num">7</span>形容詞ってどんなもの？</h2>
    <div class="def"><b>形容詞</b>：人やものの<b>様子・状態</b>を表す自立語。<b>言い切りが「〜い」</b>で終わる。活用するよ。</div>
    <h3>例</h3>
    <div class="ex">青<b>い</b>／楽し<b>い</b>／大き<b>い</b>／うれし<b>い</b>／さむ<b>い</b>／おいし<b>い</b>／深<b>い</b>／美し<b>い</b>／仰々（ぎょうぎょう）し<b>い</b>／苦<b>い</b>／ない（無い）</div>
    <p>「〜い」で言い切れるものはほぼ形容詞、と覚えていい。</p>
    <div class="tip"><b>「ない」も形容詞？</b>：「お金がない」の「ない」（＝無い）は<b>形容詞</b>。でも「行か<b>ない</b>」の「ない」は<b>助動詞</b>。これ、ややこしいから後でしっかりやるね。</div>
  `},

  // 8. 形容詞 見分け方
  { t:"形容詞 ②見分け方", html:`

      <tr><td><b>③添加（加える）</b><br>（〜まで）</td><td>風が吹けたうえに、雨<b>さえ</b>降ってきた</td></tr>
    </table>
    <div class="tip"><b>見分け方：</b>「〜すら」と言いかえられる → 類推／「〜だけで」と言いかえられる → 限定／「〜までも」と言いかえられる → 添加。</div>
  `},

  // でも（3分類）
  { t:"でも の見分け", html:`
    <h2><span class="num">45</span>「でも」 3つの意味</h2>
    <table class="tbl">

  `},

  { t:"か の見分け", html:`

    <table class="tbl">
      <tr><th>意味</th><th>例</th></tr>

      <tr><td><b>②質問</b></td><td>あなたはそれ<b>か</b>？</td></tr>

      <tr><td><b>⑦勧誘・誘う</b></td><td>こうしてに食事でもします<b>か</b></td></tr>

    <h2><span class="num">47</span>識別 まとめテスト</h2>
    <div class="quiz">
      <h4>Q. 「公園は とても きれい<b>に</b> なった。」の「に」は？</h4>
      <div class="opts">
        <button data-a="0">場所を示す助詞</button>

// ====== 状態 ======
const STORAGE_KEY='hinshi_setsumei_v1';
let cur=0;
try{
  const v=parseInt(localStorage.getItem(STORAGE_KEY)||'0',10);
  if(!isNaN(v)&&v>=0&&v<slides.length) cur=v;
}catch(e){}

const main=document.getElementById('main');
const pfill=document.getElementById('pfill');
const plabel=document.getElementById('plabel');
const ptitle=document.getElementById('ptitle');
const tocEl=document.getElementById('toc');

function render(){
  main.innerHTML='';
  slides.forEach((s,i)=>{
    const div=document.createElement('div');
    div.className='slide'+(i===cur?' active':'');
    div.innerHTML=`
      <div class="card">${s.html}</div>
      <div class="nav">
        <button class="prev" ${i===0?'disabled':''} onclick="go(${i-1})">← 前へ</button>
        <button class="next" ${i===slides.length-1?'disabled':''} onclick="go(${i+1})">次へ →</button>
      </div>
      <div class="pageno">${i+1} / ${slides.length}</div>
    `;
    main.appendChild(div);
  });
  // 目次
  tocEl.innerHTML='';
  slides.forEach((s,i)=>{
    const li=document.createElement('li');
    if(i===cur) li.className='cur';
    li.innerHTML=`<span class="nn">${i+1}</span><span>${s.t}</span>`;
    li.onclick=()=>{ go(i); toggleDrawer(); };
    tocEl.appendChild(li);
  });
  updateProgress();
  // クイズオプションのクリックハンドラ
  document.querySelectorAll('.quiz .opts button').forEach(b=>{
    b.onclick=()=>{
      const opts=b.parentElement;
      const multi=opts.dataset.multi==='1';
      if(multi){
        b.classList.toggle('sel');
      }else{
        opts.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
      }
    };
  });
}

function updateProgress(){
  const pct=((cur+1)/slides.length)*100;
  pfill.style.width=pct+'%';
  plabel.textContent=`${cur+1} / ${slides.length}`;
  ptitle.textContent=slides[cur].t;
}

function go(i){
  if(i<0||i>=slides.length) return;
  cur=i;
  try{localStorage.setItem(STORAGE_KEY,String(cur));}catch(e){}
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function checkQuiz(btn){
  const quiz=btn.parentElement;
  const opts=quiz.querySelector('.opts');
  const ans=quiz.querySelector('.ans');
  const multi=opts.dataset.multi==='1';
  const buttons=[...opts.querySelectorAll('button')];
  let ok=true;
  buttons.forEach(b=>{
    const correct=b.dataset.a==='1';
    const selected=b.classList.contains('sel');
    if(correct!==selected) ok=false;
  });
  ans.classList.add('show');
  ans.classList.toggle('ng',!ok);
  // 視覚マーク
  buttons.forEach(b=>{
    const correct=b.dataset.a==='1';
    if(correct) b.style.boxShadow='0 0 0 2px var(--mint)';
    else b.style.boxShadow='none';
  });
  if(ok){
    ans.insertAdjacentHTML('afterbegin','<div style="color:var(--mint);font-weight:700;margin-bottom:6px;">⭕ 正解！</div>');
  }else{
    ans.insertAdjacentHTML('afterbegin','<div style="color:var(--red);font-weight:700;margin-bottom:6px;">もう一度かくにん</div>');
  }
  btn.style.display='none';
}

function toggleDrawer(){
  document.getElementById('drawer').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}

function finishAll(){
  document.getElementById('modal').classList.add('show');
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
}

document.addEventListener('keydown',e=>{
  if(document.getElementById('drawer').classList.contains('open')) return;
  if(e.key==='ArrowRight') go(cur+1);
  else if(e.key==='ArrowLeft') go(cur-1);
});

render();
</script>
